# Builds and tests the website on every pull request, and publishes it to
# GitHub Pages from main.
#
# Actions are pinned to commit SHAs, not tags: a tag can be moved to point at
# different code, and these actions hold a token that can deploy the site.

name: Website

on:
  push:
    branches: [main]
    paths-ignore:
      - "contact-worker/**"
      - ".github/workflows/deploy-worker.yml"
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "contact-worker/**"
      - ".github/workflows/deploy-worker.yml"
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

# A cancelled Pages deployment can leave the site half-published, so queued runs
# on main wait rather than replace each other. Pull request runs replace their
# own earlier run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      # The build prints the resume to PDF with this browser, and the tests use it.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # Downloads the fonts named in astro.config.ts, writes the CSP meta tag, with
      # the hash of every inline script and style, into each page, and prints the
      # public resume into dist/.
      - name: Build
        run: pnpm build

      # Every page in both themes at desktop and phone widths: console errors
      # (CSP violations among them), WCAG 2.2 AA checks, links and the form.
      - name: Test the built site
        run: pnpm test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # security.txt lives in public/.well-known/ and reaches dist/ with it; the
      # action drops dot-directories unless include-hidden-files is set.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
