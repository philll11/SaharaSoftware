# Deploys the contact relay in contact-worker/ to Cloudflare.
#
# Push-triggered only. A pull_request trigger would expose CLOUDFLARE_API_TOKEN
# to code from forks.

name: Deploy contact worker

on:
  push:
    branches: [main]
    paths:
      - "contact-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The token carries the "Edit Cloudflare Workers" template and nothing
      # more. RESEND_API_KEY is a Wrangler secret and is not touched here.
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: contact-worker
